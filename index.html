<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Покупки">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Покупки</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23111113'/%3E%3Cpath d='M58 70h64l-6 58a8 8 0 0 1-8 7H72a8 8 0 0 1-8-7z' fill='none' stroke='%23fff' stroke-width='8' stroke-linejoin='round'/%3E%3Cpath d='M74 70v-6a16 16 0 0 1 32 0v6' fill='none' stroke='%23fff' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --text: #111113;
    --text2: #8e8e93;
    --text3: #c7c7cc;
    --line: rgba(0,0,0,0.07);
    --chip: #ededf0;
    --acc: #111113;
    --on-acc: #ffffff;
    --danger: #ff3b30;
    --bar: rgba(247,247,248,0.86);
    --shadow: 0 2px 8px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.06);
    --tabh: 56px;
    --safe-b: env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: #141416;
      --text: #f5f5f7;
      --text2: #8e8e93;
      --text3: #3a3a3c;
      --line: rgba(255,255,255,0.08);
      --chip: #1d1d20;
      --acc: #f5f5f7;
      --on-acc: #000000;
      --bar: rgba(10,10,12,0.86);
      --shadow: none;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
    padding: env(safe-area-inset-top) 0 calc(var(--tabh) + var(--safe-b) + 96px);
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
  }
  input { -webkit-user-select: text; user-select: text; font-family: inherit; }
  button { font-family: inherit; cursor: pointer; }

  /* Заголовок */
  header { padding: 26px 20px 4px; }
  header h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.1; }
  #sub { font-size: 14px; color: var(--text2); margin-top: 4px; min-height: 18px; }

  /* Группы и строки */
  .g-title {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; font-weight: 600; color: var(--text2);
    text-transform: uppercase; letter-spacing: 0.6px;
    padding: 24px 20px 6px;
  }
  .g-title b { font-weight: 600; color: var(--text); text-transform: none; letter-spacing: 0; font-size: 14px; }
  .sw { position: relative; overflow: hidden; }
  .sw-del {
    position: absolute; inset: 0;
    background: var(--danger); color: #fff;
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 22px; font-size: 15px; font-weight: 600;
  }
  .row {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px;
    background: var(--bg);
    transition: transform 0.22s ease;
    min-height: 54px;
  }
  .row::after {
    content: ""; position: absolute; left: 56px; right: 0; bottom: 0;
    height: 1px; background: var(--line);
  }
  .sw:last-child .row::after { display: none; }
  .ck {
    width: 22px; height: 22px; flex: 0 0 22px;
    border: 1.5px solid var(--text3); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .done .ck { background: var(--acc); border-color: var(--acc); }
  .done .ck::after {
    content: ""; width: 5px; height: 10px;
    border: solid var(--on-acc); border-width: 0 2px 2px 0;
    transform: translateY(-1px) rotate(45deg);
  }
  .r-main { flex: 1; min-width: 0; }
  .r-name { font-size: 17px; overflow-wrap: anywhere; }
  .r-sub { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .done .r-name { color: var(--text2); text-decoration: line-through; text-decoration-color: var(--text3); }
  .r-price {
    border: none; background: none; color: var(--text);
    font-size: 15px; font-weight: 500; padding: 6px 0 6px 8px; white-space: nowrap;
  }
  .r-price.noprice { color: var(--text2); font-size: 14px; font-weight: 400; }
  .r-x { display: none; border: none; background: none; color: var(--text3); font-size: 20px; padding: 4px; line-height: 1; }
  @media (hover: hover) { .row:hover .r-x { display: block; } .r-x:hover { color: var(--danger); } }
  .clear-btn {
    display: block; margin: 10px auto 0; border: none; background: none;
    color: var(--text2); font-size: 13px; padding: 10px 16px;
  }

  /* Пустые состояния */
  .empty { text-align: center; padding: 80px 40px 20px; color: var(--text2); }
  .empty svg { width: 44px; height: 44px; stroke: var(--text3); fill: none; stroke-width: 1.5; margin-bottom: 14px; }
  .empty h3 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .empty p { font-size: 15px; line-height: 1.45; }
  .empty .chips { justify-content: center; flex-wrap: wrap; margin-top: 22px; }

  /* Чипы */
  .chips {
    display: flex; gap: 8px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--line); background: transparent; color: var(--text);
    border-radius: 18px; padding: 8px 14px;
    font-size: 14px; font-weight: 500;
    transition: transform 0.1s, background 0.15s;
  }
  .chip:active { transform: scale(0.95); }
  .chip.sel { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }

  /* Нижние кнопки: завершить и + */
  #dock {
    position: fixed; left: 0; right: 0;
    bottom: calc(var(--tabh) + var(--safe-b) + 14px);
    display: flex; gap: 10px; padding: 0 16px; justify-content: flex-end;
    pointer-events: none; z-index: 20;
  }
  #dock > * { pointer-events: auto; }
  #finishBtn {
    flex: 1; height: 52px; border: none; border-radius: 26px;
    background: var(--acc); color: var(--on-acc);
    font-size: 16px; font-weight: 600; box-shadow: var(--shadow);
    display: none;
  }
  #fab {
    width: 52px; height: 52px; flex: 0 0 52px; border-radius: 50%;
    border: none; background: var(--acc); color: var(--on-acc);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow); transition: transform 0.12s;
  }
  #fab:active, #finishBtn:active { transform: scale(0.95); }
  #fab svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
  #dock.has-finish #finishBtn { display: block; }
  #dock.has-finish #fab { background: var(--surface); color: var(--text); border: 1px solid var(--line); }

  /* Нижнее меню */
  #tabbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: calc(var(--tabh) + var(--safe-b));
    padding-bottom: var(--safe-b);
    background: var(--bar);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--line);
    display: flex; z-index: 30;
  }
  .tb {
    flex: 1; border: none; background: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: var(--text2); font-size: 11px; font-weight: 500;
  }
  .tb svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tb.sel { color: var(--text); }

  /* Шторки */
  .bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.32);
    opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 60;
  }
  .bg.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: var(--kb, 0px);
    max-width: 560px; margin: 0 auto;
    background: var(--surface);
    border-radius: 22px 22px 0 0;
    padding: 10px 20px calc(18px + var(--safe-b));
    transform: translateY(110%);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 70; max-height: 86vh; overflow-y: auto;
  }
  .sheet.show { transform: none; }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--text3); margin: 0 auto 16px; }
  .s-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .s-sub { font-size: 14px; color: var(--text2); margin-top: 4px; }
  .s-label { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; margin: 18px 0 8px; }
  .s-chips { margin: 0 -20px; padding: 0 20px 2px; }
  .field {
    width: 100%; font-size: 17px; padding: 14px 16px;
    border: none; border-radius: 14px;
    background: var(--chip); color: var(--text); outline: none;
  }
  .field::placeholder { color: var(--text2); }
  .f-row { display: flex; gap: 10px; }
  .f-row .qty { flex: 0 0 104px; }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    flex: 1; height: 50px; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 600;
  }
  .btn.primary { background: var(--acc); color: var(--on-acc); }
  .btn.ghost { background: var(--chip); color: var(--text); }
  .btn.danger { background: var(--chip); color: var(--danger); }
  .btn:disabled { opacity: 0.35; }
  .ir {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 13px 0; font-size: 16px; border-bottom: 1px solid var(--line);
  }
  .ir:last-child { border-bottom: none; }
  .ir span:last-child { color: var(--text2); white-space: nowrap; }
  .ir small { color: var(--text2); font-size: 13px; margin-left: 6px; }
  #infoBody { margin-top: 10px; }

  /* Диалог */
  #dlg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.36);
    display: none; align-items: center; justify-content: center;
    z-index: 90; padding: 20px;
  }
  #dlg.show { display: flex; }
  .dlg-box { background: var(--surface); border-radius: 20px; width: 100%; max-width: 320px; padding: 22px 18px 16px; }
  #dlgTitle { font-size: 17px; font-weight: 600; text-align: center; }
  #dlgSub { font-size: 14px; color: var(--text2); text-align: center; margin-top: 6px; line-height: 1.4; }
  #dlgInput { margin-top: 16px; text-align: center; font-size: 20px; }
  .dlg-box .actions { margin-top: 16px; }
  .btn.red { background: var(--danger); color: #fff; }

  /* Тост */
  #toast {
    position: fixed; left: 50%;
    bottom: calc(var(--tabh) + var(--safe-b) + 80px);
    transform: translate(-50%, 10px);
    background: var(--acc); color: var(--on-acc);
    border-radius: 14px; padding: 12px 16px;
    font-size: 14px; display: flex; gap: 16px; align-items: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
    z-index: 80; max-width: calc(100% - 40px); white-space: nowrap;
  }
  #toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  #toast button { border: none; background: none; color: var(--on-acc); font-size: 14px; font-weight: 700; padding: 0; }
  #toast span { overflow: hidden; text-overflow: ellipsis; }

  /* Мої списки */
  .btn-line {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: calc(100% - 40px); margin: 16px 20px 0; height: 50px;
    border: 1px solid var(--line); border-radius: 14px;
    background: transparent; color: var(--text); font-size: 15px; font-weight: 500;
  }
  .btn-line:disabled { opacity: 0.35; }
  .nav-row {
    position: relative; display: flex; align-items: center; gap: 12px;
    padding: 15px 20px; cursor: pointer;
  }
  .nav-row::after { content: ""; position: absolute; left: 20px; right: 0; bottom: 0; height: 1px; background: var(--line); }
  .nav-row:last-child::after { display: none; }
  .nav-row:active { background: var(--chip); }
  .n-main { flex: 1; min-width: 0; }
  .n-name { font-size: 17px; }
  .n-sub { font-size: 13px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .n-right { text-align: right; white-space: nowrap; }
  .n-sum { font-size: 16px; font-weight: 600; }
  .n-conv { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .chev { color: var(--text3); font-size: 22px; line-height: 1; }

  /* Статистика */
  .hero { padding: 20px 20px 0; }
  .hero .big { font-size: 42px; font-weight: 700; letter-spacing: -1.2px; line-height: 1.05; }
  .hero .big span { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; color: var(--text2); margin-left: 4px; }
  .hero .conv { font-size: 15px; color: var(--text2); margin-top: 6px; }
  .mini { display: flex; gap: 28px; margin-top: 20px; }
  .mini b { display: block; font-size: 17px; font-weight: 600; }
  .mini span { font-size: 12px; color: var(--text2); }
  .chart { padding: 30px 20px 0; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 130px; }
  .bar-col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .bar { width: 100%; max-width: 34px; border-radius: 8px; background: var(--chip); min-height: 4px; }
  .bar-col.cur .bar { background: var(--acc); }
  .bar-val { font-size: 10px; color: var(--text2); margin-bottom: 4px; white-space: nowrap; }
  .bar-lbl { font-size: 11px; color: var(--text2); margin-top: 6px; }
  .bar-col.cur .bar-lbl { color: var(--text); font-weight: 600; }

  /* Налаштування і сканування чека */
  header { position: relative; }
  #gear {
    position: absolute; right: 16px; top: 28px;
    width: 38px; height: 38px; border-radius: 50%;
    border: none; background: var(--chip); color: var(--text2);
    display: flex; align-items: center; justify-content: center;
  }
  #gear svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #scanBtn {
    width: 52px; height: 52px; flex: 0 0 52px; border-radius: 50%;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow); transition: transform 0.12s;
  }
  #scanBtn:active { transform: scale(0.95); }
  #scanBtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linejoin: round; }
  #busy {
    position: fixed; inset: 0; background: rgba(0,0,0,0.36);
    display: none; align-items: center; justify-content: center; z-index: 95;
  }
  #busy.show { display: flex; }
  .busy-box { background: var(--surface); border-radius: 20px; padding: 26px 28px; text-align: center; min-width: 220px; }
  .spin {
    width: 30px; height: 30px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--chip); border-top-color: var(--acc);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #busyText { font-size: 16px; font-weight: 600; }
  .busy-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .rv-sec { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; margin: 18px 0 2px; }
  .rv {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .rv:last-child { border-bottom: none; }
  .rv.static { cursor: default; }
  .rv.on .ck { background: var(--acc); border-color: var(--acc); }
  .rv.on .ck::after {
    content: ""; width: 5px; height: 10px;
    border: solid var(--on-acc); border-width: 0 2px 2px 0;
    transform: translateY(-1px) rotate(45deg);
  }
  .rv:not(.on):not(.static) .rv-main, .rv:not(.on):not(.static) .rv-price { opacity: 0.4; }
  .rv-main { flex: 1; min-width: 0; }
  .rv-name { font-size: 16px; }
  .rv-sub { font-size: 12px; color: var(--text2); margin-top: 2px; overflow-wrap: anywhere; }
  .rv-price { font-size: 15px; font-weight: 600; white-space: nowrap; text-align: right; }
  .rv-price s { color: var(--text2); font-weight: 400; margin-right: 4px; }
  .rv-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; font-size: 17px; font-weight: 700; }
  .rv-total small { display: block; font-size: 12px; font-weight: 400; color: var(--text2); text-align: right; margin-top: 2px; }
  .set-title { font-size: 16px; font-weight: 600; margin-top: 14px; }
  .set-p { font-size: 15px; line-height: 1.45; margin-top: 6px; }
  .muted { color: var(--text2); font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1 id="title">Покупки</h1>
  <div id="sub"></div>
  <button id="gear" aria-label="Налаштування"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</header>

<main id="view"></main>

<div id="dock">
  <button id="scanBtn" aria-label="Сфотографувати чек"><svg viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.8l1.4-2h6.6l1.4 2h1.8A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="12.8" r="3.6"/></svg></button>
  <button id="finishBtn"></button>
  <button id="fab" aria-label="Додати товар"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<nav id="tabbar">
  <button class="tb sel" data-tab="list">
    <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
    Список
  </button>
  <button class="tb" data-tab="saved">
    <svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg>
    Мої списки
  </button>
  <button class="tb" data-tab="stats">
    <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
    Статистика
  </button>
</nav>

<!-- Шторка добавления -->
<div class="bg" id="addBg"></div>
<div class="sheet" id="addSheet">
  <div class="grab"></div>
  <div class="f-row">
    <input class="field" id="nameInput" type="text" placeholder="Що купити?" autocomplete="off" enterkeyhint="done">
    <input class="field qty" id="qtyInput" type="text" placeholder="К-сть" autocomplete="off" enterkeyhint="done">
  </div>
  <div class="s-label">Категорія</div>
  <div class="chips s-chips" id="cats"></div>
  <div id="favBlock">
    <div class="s-label">Часто купуєте</div>
    <div class="chips s-chips" id="favs"></div>
  </div>
  <div class="actions">
    <button class="btn ghost" id="addClose">Готово</button>
    <button class="btn primary" id="addBtn">Додати</button>
  </div>
</div>

<!-- Шторка просмотра (сохранённый список / покупка) -->
<div class="bg" id="infoBg"></div>
<div class="sheet" id="infoSheet">
  <div class="grab"></div>
  <div class="s-title" id="infoTitle"></div>
  <div class="s-sub" id="infoSub"></div>
  <div id="infoBody"></div>
  <div class="actions" id="infoActions"></div>
</div>

<!-- Диалог -->
<div id="dlg">
  <div class="dlg-box">
    <div id="dlgTitle"></div>
    <div id="dlgSub"></div>
    <input class="field" id="dlgInput" autocomplete="off">
    <div class="actions">
      <button class="btn ghost" id="dlgCancel">Скасувати</button>
      <button class="btn primary" id="dlgOk">Готово</button>
    </div>
  </div>
</div>

<div id="toast"><span id="toastText"></span><button id="toastBtn"></button></div>

<div id="busy"><div class="busy-box"><div class="spin"></div><div id="busyText"></div><div class="busy-sub"><span id="busySec">0 с</span> · зазвичай 5–15 секунд</div></div></div>
<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
const CATS = [
  { id: "fruit",  name: "Овочі та фрукти" },
  { id: "dairy",  name: "Молочне" },
  { id: "meat",   name: "М'ясо та риба" },
  { id: "bakery", name: "Хліб" },
  { id: "grocery",name: "Бакалія" },
  { id: "frozen", name: "Заморожене" },
  { id: "drinks", name: "Напої" },
  { id: "home",   name: "Дім і побут" },
  { id: "other",  name: "Різне" }
];

const AUTO = {
  fruit:  ["яблок","банан","огурц","огурец","помидор","томат","картош","картоф","лук","морков","капуст","перец","зелень","укроп","петрушк","лимон","апельсин","мандарин","груш","виноград","ягод","клубник","авокадо","чеснок","свекл","кабач","баклажан","салат","грибы","шампиньон"],
  dairy:  ["молок","кефир","творог","сметан","йогурт","сыр","маслян","сливк","ряженк","сливочн"],
  meat:   ["куриц","курин","мясо","говядин","свинин","фарш","рыб","лосос","сельд","колбас","сосиск","ветчин","бекон","индейк","котлет","креветк"],
  bakery: ["хлеб","батон","булк","лаваш","багет","выпечк","круассан","пирож"],
  grocery:["макарон","рис","гречк","мука","сахар","соль","масло растит","подсолнечн","оливков","крупа","овсянк","чай","кофе","яйц","яиц","консерв","томатн паст","специи","печень","шоколад","конфет"],
  frozen: ["пельмен","мороженое","заморож","вареник"],
  drinks: ["вода","сок","газиров","лимонад","квас","пиво","вино","минералк","кола"],
  home:   ["бумаг","салфетк","мыло","шампун","зубн","порошок","гель","губк","пакет","фольг","средство","чистящ","туалетн"]
};

const AUTO_UK = {
  fruit:  ["яблук","огір","огірк","помідор","картопл","цибул","морк","кріп","петрушк","лимон","апельсин","мандарин","груш","виноград","ягід","ягод","полуниц","авокадо","часник","буряк","кабачк","баклажан","салат","гриб","печериц"],
  dairy:  ["молок","кефір","сир","сметан","йогурт","вершк","ряжанк","масло вершк"],
  meat:   ["курк","курят","курин","м'яс","мяс","яловичин","свинин","фарш","риб","лосос","оселед","ковбас","сосиск","шинк","бекон","індич","індик","котлет","кревет"],
  bakery: ["хліб","батон","булк","лаваш","багет","круасан","пиріж","випічк"],
  grocery:["макарон","рис","гречк","борошн","цукор","цукр","сіль","олія","крупа","вівсян","чай","кава","яйц","яєць","консерв","спеці","печив","шоколад","цукерк"],
  frozen: ["пельмен","морозив","заморож","вареник"],
  drinks: ["вода","сік","газован","лимонад","квас","пиво","вино","мінералк","кола"],
  home:   ["папір","серветк","мило","шампун","зубн","порошок","гель","губк","пакет","фольг","засіб","туалетн"]
};
for (const k in AUTO_UK) AUTO[k] = AUTO[k].concat(AUTO_UK[k]);

const MONTHS = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
const MONTHS_S = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];

const $ = id => document.getElementById(id);

/* ---------- Данные ---------- */
const KEY = "shoplist_v1";
let state = load();

function load() {
  let s = { items: [], history: {}, savedLists: {}, trips: [] };
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) s = Object.assign(s, JSON.parse(raw));
  } catch (e) {}
  s.items = s.items || [];
  s.history = s.history || {};
  s.savedLists = s.savedLists || {};
  s.trips = s.trips || [];
  return s;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

/* ---------- Курсы (базовая валюта — лей) ---------- */
let rates = { EUR: 0.197, UAH: 9.7 };
try {
  const r = JSON.parse(localStorage.getItem("ron_rates"));
  if (r && r.EUR && r.UAH) rates = r;
} catch (e) {}
if (typeof fetch === "function") {
  fetch("https://open.er-api.com/v6/latest/RON")
    .then(r => r.json())
    .then(d => {
      if (d && d.rates && d.rates.EUR && d.rates.UAH) {
        rates = { EUR: d.rates.EUR, UAH: d.rates.UAH };
        try { localStorage.setItem("ron_rates", JSON.stringify(rates)); } catch (e) {}
        if (tab === "stats") render();
      }
    })
    .catch(() => {});
}

/* ---------- Утилиты ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function num(n, d) { return n.toLocaleString("uk-UA", { maximumFractionDigits: d == null ? 2 : d }); }
function eur(n) { return num(n * rates.EUR, 1); }
function uah(n) { return num(n * rates.UAH, 0); }
function conv(n) { return "≈ " + eur(n) + " € · " + uah(n) + " грн"; }
function parseNum(v) { return parseFloat(String(v).replace(",", ".").replace(/\s/g, "")); }
function guessCat(name) {
  const n = name.toLowerCase();
  for (const cat in AUTO) if (AUTO[cat].some(w => n.includes(w))) return cat;
  return "other";
}
function plural(n, a, b, c) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return a;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b;
  return c;
}
function fmtDate(iso) {
  const d = new Date(iso);
  return d.getDate() + " " + MONTHS_S[d.getMonth()] + " " + d.getFullYear();
}
function tripItems(t) {
  return t.items.map(it => typeof it === "string" ? { name: it, qty: "", price: null } : it);
}

/* ---------- Действия со списком ---------- */
function addItem(name, qty, cat) {
  name = name.trim();
  if (!name) return false;
  const key = name.toLowerCase();
  const existing = state.items.find(i => i.name.toLowerCase() === key && !i.done);
  const c = cat || guessCat(name);
  if (existing) {
    if (qty) existing.qty = qty;
  } else {
    state.items.push({ id: Date.now() + Math.random(), name, qty: qty || "", cat: c, done: false });
  }
  const h = state.history[key] || { name, count: 0, cat: c, qty: "" };
  h.count++;
  if (qty) h.qty = qty;
  state.history[key] = h;
  save();
  return true;
}

function toggle(id) {
  const it = state.items.find(i => i.id === id);
  if (!it) return;
  it.done = !it.done;
  save(); render();
  if (it.done && it.price == null) askPrice(it);
}

function askPrice(it) {
  dialog({
    title: "Ціна товару",
    sub: it.name + " · у леях",
    input: { placeholder: "0", mode: "decimal", preset: it.price != null ? it.price : "" },
    ok: "Готово", cancel: "Пізніше"
  }, v => {
    if (v === "") { it.price = null; save(); render(); return; }
    const p = parseNum(v);
    if (!isNaN(p) && p >= 0) { it.price = p; save(); render(); }
  });
}

function removeWithUndo(id) {
  const idx = state.items.findIndex(i => i.id === id);
  if (idx < 0) return;
  const item = state.items[idx];
  state.items.splice(idx, 1);
  save(); render();
  toast("Видалено: " + item.name, "Повернути", () => {
    state.items.splice(Math.min(idx, state.items.length), 0, item);
    save(); render();
  });
}

/* ---------- Вкладки и отрисовка ---------- */
let tab = "list";

function setTab(t) {
  tab = t;
  document.querySelectorAll(".tb").forEach(b => b.classList.toggle("sel", b.dataset.tab === t));
  window.scrollTo(0, 0);
  render();
}
document.querySelectorAll(".tb").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

function render() {
  if (tab === "list") renderList();
  else if (tab === "saved") renderSaved();
  else renderStats();
  renderDock();
}

function renderDock() {
  const done = state.items.filter(i => i.done);
  const dock = $("dock");
  dock.style.display = tab === "list" ? "" : "none";
  dock.classList.toggle("has-finish", done.length > 0);
  const total = done.reduce((s, i) => s + (i.price || 0), 0);
  $("finishBtn").textContent = total ? "Завершити покупку · " + num(total) + " лей" : "Завершити покупку";
}

const ICON_BAG = '<svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9z" stroke-linejoin="round"/><path d="M9 8V7a3 3 0 0 1 6 0v1" stroke-linecap="round"/></svg>';

function rowHtml(i) {
  let price = "";
  if (i.price != null) price = `<button class="r-price">${num(i.price)} лей</button>`;
  else if (i.done) price = `<button class="r-price noprice">+ ціна</button>`;
  return `<div class="sw" data-id="${i.id}">
    <div class="sw-del">Видалити</div>
    <div class="row${i.done ? " done" : ""}">
      <span class="ck"></span>
      <div class="r-main">
        <div class="r-name">${esc(i.name)}</div>
        ${i.qty ? `<div class="r-sub">${esc(i.qty)}</div>` : ""}
      </div>
      ${price}
      <button class="r-x" aria-label="Видалити">×</button>
    </div>
  </div>`;
}

function topFavs(limit) {
  const active = new Set(state.items.filter(i => !i.done).map(i => i.name.toLowerCase()));
  return Object.values(state.history)
    .filter(h => h.count >= 2 && !active.has(h.name.toLowerCase()))
    .sort((a, b) => b.count - a.count)
    .slice(0, limit);
}

function renderList() {
  $("title").textContent = "Покупки";
  const active = state.items.filter(i => !i.done);
  const done = state.items.filter(i => i.done);
  const parts = [];
  if (active.length) parts.push(active.length + " " + plural(active.length, "залишилось", "залишилось", "залишилось"));
  if (done.length) parts.push(done.length + " у кошику");
  $("sub").textContent = parts.join(" · ");

  const view = $("view");
  if (!state.items.length) {
    const favs = topFavs(8);
    view.innerHTML = `<div class="empty">${ICON_BAG}
      <h3>Список порожній</h3>
      <p>Натисніть +, щоб додати товар</p>
      ${favs.length ? `<div class="chips">${favs.map(h =>
        `<button class="chip fav" data-name="${esc(h.name)}" data-qty="${esc(h.qty || "")}" data-cat="${h.cat}">+ ${esc(h.name)}</button>`).join("")}</div>` : ""}
    </div>`;
    return;
  }

  let html = "";
  for (const cat of CATS) {
    const items = active.filter(i => (i.cat || "other") === cat.id);
    if (!items.length) continue;
    html += `<div class="g-title">${cat.name}</div>` + items.map(rowHtml).join("");
  }
  // старые товары с неизвестной категорией
  const known = new Set(CATS.map(c => c.id));
  const orphan = active.filter(i => !known.has(i.cat || "other"));
  if (orphan.length) html += `<div class="g-title">Різне</div>` + orphan.map(rowHtml).join("");

  if (done.length) {
    const total = done.reduce((s, i) => s + (i.price || 0), 0);
    html += `<div class="g-title">У кошику${total ? `<b>${num(total)} лей</b>` : ""}</div>` + done.map(rowHtml).join("");
    html += `<button class="clear-btn" id="clearDone">Прибрати відмічені без збереження</button>`;
  }
  view.innerHTML = html;
}

function renderSaved() {
  $("title").textContent = "Мої списки";
  const names = Object.keys(state.savedLists);
  $("sub").textContent = names.length ? names.length + " " + plural(names.length, "список", "списки", "списків") : "";
  let html = `<button class="btn-line" id="saveCur" ${state.items.length ? "" : "disabled"}>Зберегти поточний список</button>`;
  if (!names.length) {
    html += `<div class="empty" style="padding-top:60px">
      <svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z" stroke-linejoin="round"/></svg>
      <h3>Немає збережених списків</h3>
      <p>Збережіть список, щоб потім додати його одним натисканням — наприклад «На тиждень»</p>
    </div>`;
  } else {
    html += `<div style="margin-top:14px">` + names.map(n => {
      const items = state.savedLists[n];
      const preview = items.slice(0, 4).map(i => i.name).join(", ") + (items.length > 4 ? "…" : "");
      return `<div class="nav-row saved-row" data-name="${esc(n)}">
        <div class="n-main">
          <div class="n-name">${esc(n)}</div>
          <div class="n-sub">${items.length} ${plural(items.length, "товар", "товари", "товарів")} · ${esc(preview)}</div>
        </div>
        <span class="chev">›</span>
      </div>`;
    }).join("") + `</div>`;
  }
  $("view").innerHTML = html;
}

function renderStats() {
  $("title").textContent = "Статистика";
  const now = new Date();
  $("sub").textContent = MONTHS[now.getMonth()] + " " + now.getFullYear();
  const trips = state.trips.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  if (!trips.length) {
    $("view").innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6" stroke-linecap="round"/></svg>
      <h3>Поки немає покупок</h3>
      <p>Відмітьте куплені товари й натисніть «Завершити покупку» — витрати з'являться тут</p>
    </div>`;
    return;
  }
  const byMonth = {};
  for (const t of trips) {
    const d = new Date(t.date);
    const k = d.getFullYear() + "-" + d.getMonth();
    byMonth[k] = byMonth[k] || { sum: 0, count: 0 };
    byMonth[k].sum += t.sum;
    byMonth[k].count++;
  }
  const cur = byMonth[now.getFullYear() + "-" + now.getMonth()] || { sum: 0, count: 0 };
  const avg = cur.count ? cur.sum / cur.count : 0;

  let html = `<div class="hero">
    <div class="big">${num(cur.sum)}<span>лей</span></div>
    <div class="conv">${conv(cur.sum)}</div>
    <div class="mini">
      <div><b>${cur.count}</b><span>${plural(cur.count, "покупка", "покупки", "покупок")}</span></div>
      <div><b>${num(avg, 0)} лей</b><span>середній чек</span></div>
      <div><b>${eur(avg)} €</b><span>середній чек</span></div>
    </div>
  </div>`;

  const cols = [];
  let max = 0;
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const m = byMonth[d.getFullYear() + "-" + d.getMonth()] || { sum: 0 };
    max = Math.max(max, m.sum);
    cols.push({ lbl: MONTHS_S[d.getMonth()], sum: m.sum, cur: i === 0 });
  }
  html += `<div class="chart"><div class="bars">` + cols.map(c => {
    const h = max ? Math.max(3, Math.round(c.sum / max * 80)) : 3;
    return `<div class="bar-col${c.cur ? " cur" : ""}">
      <div class="bar-val">${c.sum ? num(c.sum, 0) : ""}</div>
      <div class="bar" style="height:${h}%"></div>
      <div class="bar-lbl">${c.lbl}</div>
    </div>`;
  }).join("") + `</div></div>`;

  html += `<div class="g-title">Історія</div>` + trips.slice(0, 50).map(t => {
    const items = tripItems(t);
    const preview = items.slice(0, 3).map(i => i.name).join(", ") + (items.length > 3 ? "…" : "");
    return `<div class="nav-row trip-row" data-date="${t.date}">
      <div class="n-main">
        <div class="n-name">${fmtDate(t.date)}</div>
        <div class="n-sub">${items.length} ${plural(items.length, "товар", "товари", "товарів")} · ${esc(preview)}</div>
      </div>
      <div class="n-right">
        <div class="n-sum">${num(t.sum)} лей</div>
        <div class="n-conv">${eur(t.sum)} € · ${uah(t.sum)} грн</div>
      </div>
    </div>`;
  }).join("");
  $("view").innerHTML = html;
}

/* ---------- Клики по содержимому ---------- */
let suppressClick = false;

$("view").addEventListener("click", e => {
  if (suppressClick) return;

  const fav = e.target.closest(".fav");
  if (fav) {
    addItem(fav.dataset.name, fav.dataset.qty, fav.dataset.cat);
    render();
    return;
  }
  if (e.target.closest("#clearDone")) {
    state.items = state.items.filter(i => !i.done);
    save(); render();
    return;
  }
  if (e.target.closest("#saveCur")) { saveCurrent(); return; }

  const sr = e.target.closest(".saved-row");
  if (sr) { openSaved(sr.dataset.name); return; }

  const tr = e.target.closest(".trip-row");
  if (tr) {
    const t = state.trips.find(x => x.date === tr.dataset.date);
    if (t) openTrip(t);
    return;
  }

  const w = e.target.closest(".sw");
  if (!w) return;
  const id = parseFloat(w.dataset.id);
  if (e.target.closest(".r-x")) { removeWithUndo(id); return; }
  if (e.target.closest(".r-price")) {
    const it = state.items.find(i => i.id === id);
    if (it) askPrice(it);
    return;
  }
  toggle(id);
});

/* ---------- Свайп для удаления ---------- */
let sw = null;
$("view").addEventListener("touchstart", e => {
  const w = e.target.closest(".sw");
  if (!w) return;
  const t = e.touches[0];
  sw = { w, row: w.querySelector(".row"), x: t.clientX, y: t.clientY, dx: 0, dir: null };
}, { passive: true });

$("view").addEventListener("touchmove", e => {
  if (!sw) return;
  const t = e.touches[0];
  const dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (!sw.dir && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) sw.dir = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
  if (sw.dir !== "h") return;
  e.preventDefault();
  sw.dx = Math.min(0, dx);
  sw.row.style.transition = "none";
  sw.row.style.transform = "translateX(" + sw.dx + "px)";
}, { passive: false });

function endSwipe() {
  if (!sw) return;
  const s = sw; sw = null;
  if (s.dir !== "h") return;
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 350);
  s.row.style.transition = "";
  if (s.dx < -90) {
    s.row.style.transform = "translateX(-100%)";
    setTimeout(() => removeWithUndo(parseFloat(s.w.dataset.id)), 180);
  } else {
    s.row.style.transform = "";
  }
}
$("view").addEventListener("touchend", endSwipe);
$("view").addEventListener("touchcancel", endSwipe);

/* ---------- Шторка добавления ---------- */
let selCat = null;

function renderAddSheet() {
  $("cats").innerHTML =
    `<button class="chip${selCat === null ? " sel" : ""}" data-cat="">Авто</button>` +
    CATS.map(c => `<button class="chip${selCat === c.id ? " sel" : ""}" data-cat="${c.id}">${c.name}</button>`).join("");
  const favs = topFavs(12);
  $("favBlock").style.display = favs.length ? "" : "none";
  $("favs").innerHTML = favs.map(h =>
    `<button class="chip" data-name="${esc(h.name)}" data-qty="${esc(h.qty || "")}" data-cat="${h.cat}">+ ${esc(h.name)}</button>`
  ).join("");
}

function openAdd() {
  selCat = null;
  $("nameInput").value = "";
  $("qtyInput").value = "";
  renderAddSheet();
  $("addBg").classList.add("show");
  $("addSheet").classList.add("show");
  $("nameInput").focus();
}
function closeAdd() {
  $("addBg").classList.remove("show");
  $("addSheet").classList.remove("show");
  document.activeElement && document.activeElement.blur();
}

function doAdd() {
  const name = $("nameInput").value.trim();
  if (!name) { $("nameInput").focus(); return; }
  addItem(name, $("qtyInput").value.trim(), selCat);
  $("nameInput").value = "";
  $("qtyInput").value = "";
  selCat = null;
  renderAddSheet();
  render();
  toast("Додано: " + name);
  $("nameInput").focus();
}

$("fab").addEventListener("click", openAdd);

function finishPurchase(preset, fromReceipt) {
  const bought = state.items.filter(i => i.done);
  if (!bought.length) return;
  const total = bought.reduce((s, i) => s + (i.price || 0), 0);
  const noPrice = bought.filter(i => i.price == null).length;
  const n = bought.length + " " + plural(bought.length, "товар", "товари", "товарів");
  let sub;
  if (fromReceipt) sub = "Сума за чеком · " + n;
  else if (noPrice) sub = "У " + noPrice + " " + plural(noPrice, "товару", "товарів", "товарів") + " немає ціни — перевірте суму в леях";
  else sub = n + " · сума в леях";
  const p = preset != null && !isNaN(preset) ? +(+preset).toFixed(2) : (total ? +total.toFixed(2) : "");
  dialog({
    title: "Підсумок покупки",
    sub,
    input: { placeholder: "0", mode: "decimal", preset: p },
    ok: "Зберегти"
  }, v => {
    const sum = parseNum(v);
    if (isNaN(sum) || sum < 0) { toast("Введіть суму"); return; }
    state.trips.push({
      date: new Date().toISOString(),
      sum,
      items: bought.map(i => ({ name: i.name, qty: i.qty, price: i.price != null ? i.price : null }))
    });
    state.items = state.items.filter(i => !i.done);
    save();
    setTab("stats");
    toast("Покупку збережено");
  });
}

}

async function prepImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error("image"));
      im.src = url;
    });
    const max = 2000;
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    return c.toDataURL("image/jpeg", 0.8).split(",")[1];
  } finally {
    URL.revokeObjectURL(url);
  }
}

function buildPrompt(cands) {
  const list = cands.map(c => ({ id: c.id, name: c.label, qty: c.qty || "" }));
  return `You are reading a photo of a store receipt. It is most likely from Romania (Romanian language, currency lei / RON).
Extract every purchased product line. For each line return:
- receipt_name: the product text exactly as printed
- name_uk: a short, natural product name in Ukrainian (for example "Молоко", "Хліб", "Банани")
- qty: quantity with unit as a short Ukrainian string such as "2 шт" or "0,5 кг", or null for a single piece
- price: the final amount paid for this line in lei, after any discount that applies to it, as a number
- match_id: the id of the item from MY LIST that is clearly the same kind of product (my list is written in Ukrainian or Russian, e.g. "LAPTE ZUZU 1.5%" matches "Молоко"), otherwise null. Use each id at most once.
Merge discount lines (reducere, discount) into the product they belong to. Skip lines that are not products: subtotal, TVA, payment method, card, cash, change, loyalty points. Plastic bags (pungă, sacoșă) are products.
Also return: store (store name or null), date (YYYY-MM-DD or null), total (the final total to pay in lei as a number, or null).
If the image is not a receipt, return an empty lines array.
MY LIST:
${JSON.stringify(list)}
Respond with JSON only, in this shape: {"store": string|null, "date": string|null, "total": number|null, "lines": [{"receipt_name": string, "name_uk": string, "qty": string|null, "price": number, "match_id": string|null}]}`;
}

// Порядок важен: сначала быстрые модели с минимальным «обдумыванием»
const GEMINI_MODELS = [
  { id: "gemini-3.6-flash", think: "minimal" },
  { id: "gemini-3.5-flash-lite", think: "minimal" },
  { id: "gemini-flash-latest", think: "low" }
];
const GEMINI_TIMEOUT = 60000;

async function callGemini(model, think, key, b64, prompt) {
  const gen = { responseMimeType: "application/json", temperature: 0 };
  if (think) gen.thinkingConfig = { thinkingLevel: think };
  const ctrl = typeof AbortController === "function" ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), GEMINI_TIMEOUT) : null;
  try {
    return await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: b64 } }] }],
        generationConfig: gen
      }),
      signal: ctrl ? ctrl.signal : undefined
    });
  } catch (e) {
    throw new Error(e && e.name === "AbortError" ? "timeout" : "net");
  } finally {
    if (timer) clearTimeout(timer);
  }
}

async function gemini(b64, prompt) {
  const key = getKey();
  let lastErr = new Error("model");
  for (const m of GEMINI_MODELS) {
    let think = m.think;
    for (let attempt = 0; attempt < 2; attempt++) {
      const r = await callGemini(m.id, think, key, b64, prompt);
      const d = await r.json().catch(() => ({}));
      if (r.ok) {
        const parts = (((d.candidates || [])[0] || {}).content || {}).parts || [];
        const text = parts.filter(p => p.text && !p.thought).map(p => p.text).join("");
        try { return parseJson(text); } catch (e) { throw new Error("parse"); }
      }
      const msg = (d.error && d.error.message) || "";
      // модель не принимает настройку «обдумывания» — повторяем без неё
      if (r.status === 400 && think && /think/i.test(msg)) { think = null; continue; }
      if (r.status === 404 || (r.status === 400 && /not found|not supported|unsupported/i.test(msg) && !/api key/i.test(msg))) { lastErr = new Error("model"); break; }
      if (r.status === 401 || r.status === 403 || /api key/i.test(msg)) throw new Error("key");
      if (r.status === 429) throw new Error("limit");
      if (r.status >= 500) { lastErr = new Error("model"); break; }
      throw new Error("parse");
    }
  }
  throw lastErr;
}

function parseJson(t) {
  t = String(t || "").trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  return JSON.parse(t.slice(a, b + 1));
}

/* ---------- Экран проверки распознанного чека ---------- */
function openReview(res, mode) {
  const lines = (res && Array.isArray(res.lines) ? res.lines : []).map(l => ({
    receipt: String(l.receipt_name || "").trim(),
    name: String(l.name_uk || l.receipt_name || "").trim(),
    qty: l.qty ? String(l.qty).trim() : "",
    price: parseNum(l.price),
    match: l.match_id ? String(l.match_id) : null
  })).filter(l => l.name && !isNaN(l.price));

  if (!lines.length) {
    showError("Не вдалося знайти товари на фото. Спробуйте сфотографувати чек ближче, рівніше й при хорошому світлі.");
    return;
  }

  const byId = {};
  mode.cands.forEach(c => { byId[c.id] = c; });
  const matched = [], fresh = [], usedRow = {};
  for (const l of lines) {
    const c = l.match && byId[l.match];
    if (c) {
      if (usedRow[c.id]) {
        const row = usedRow[c.id];
        row.price += l.price;
        row.receipt += ", " + l.receipt;
      } else {
        const row = { kind: "m", c, price: l.price, qty: l.qty, receipt: l.receipt, on: true };
        usedRow[c.id] = row;
        matched.push(row);
      }
    } else {
      fresh.push({ kind: "n", name: l.name, price: l.price, qty: l.qty, receipt: l.receipt, on: true });
    }
  }
  const missing = mode.cands.filter(c => c.relevant && !usedRow[c.id]);
  const rows = matched.concat(fresh);
  const linesSum = lines.reduce((s, l) => s + l.price, 0);
  let total = parseNum(res.total);
  if (isNaN(total)) total = linesSum;

  const rowHtml = (r, k) => {
    const name = r.kind === "m" ? r.c.label : r.name;
    const old = r.kind === "m" ? r.c.price : null;
    const subParts = [];
    if (r.receipt) subParts.push(esc(r.receipt));
    if (r.qty) subParts.push(esc(r.qty));
    return `<div class="rv${r.on ? " on" : ""}" data-k="${k}">
      <span class="ck"></span>
      <div class="rv-main"><div class="rv-name">${esc(name)}</div>${subParts.length ? `<div class="rv-sub">${subParts.join(" · ")}</div>` : ""}</div>
      <div class="rv-price">${old != null && Math.abs(old - r.price) > 0.004 ? `<s>${num(old)}</s>` : ""}${num(r.price)} лей</div>
    </div>`;
  };

  let body = "";
  if (matched.length) body += `<div class="rv-sec">Зі списку</div>` + matched.map((r, i) => rowHtml(r, i)).join("");
  if (fresh.length) body += `<div class="rv-sec">Нове в чеку</div>` + fresh.map((r, i) => rowHtml(r, matched.length + i)).join("");
  if (missing.length) {
    body += `<div class="rv-sec">Немає в чеку</div>` + missing.map(c =>
      `<div class="rv static"><div class="rv-main"><div class="rv-name">${esc(c.label)}</div><div class="rv-sub">залишиться без змін</div></div><div class="rv-price">${c.price != null ? num(c.price) + " лей" : "—"}</div></div>`
    ).join("");
  }
  body += `<div class="rv-total"><span>Сума за чеком</span><span>${num(total)} лей<small>${conv(total)}</small></span></div>`;

  const subBits = [];
  if (res.store) subBits.push(String(res.store));
  if (res.date && !isNaN(new Date(res.date))) subBits.push(fmtDate(res.date));
  subBits.push(lines.length + " " + plural(lines.length, "позиція", "позиції", "позицій"));

  openInfo("Чек розпізнано", subBits.join(" · "), body, [
    { text: "Скасувати", cls: "ghost", fn: closeInfo },
    { text: "Застосувати", cls: "primary", fn: () => applyReview(mode, rows, total) }
  ]);

  $("infoBody").onclick = e => {
    const el = e.target.closest(".rv[data-k]");
    if (!el) return;
    const r = rows[+el.dataset.k];
    r.on = !r.on;
    el.classList.toggle("on", r.on);
  };
}

function applyReview(mode, rows, total) {
  const on = rows.filter(r => r.on);
  if (mode.type === "cart") {
    for (const r of on) {
      if (r.kind === "m") {
        r.c.ref.price = +r.price.toFixed(2);
        if (r.qty) r.c.ref.qty = r.qty;
        r.c.ref.done = true;
      } else {
        state.items.push({ id: Date.now() + Math.random(), name: r.name, qty: r.qty || "", cat: guessCat(r.name), done: true, price: +r.price.toFixed(2) });
      }
    }
    save();
    closeInfo();
    setTab("list");
    finishPurchase(total, true);
  } else {
    const t = mode.trip;
    for (const r of on) {
      if (r.kind === "m") {
        r.c.ref.price = +r.price.toFixed(2);
        if (r.qty) r.c.ref.qty = r.qty;
      } else {
        t.items.push({ name: r.name, qty: r.qty || "", price: +r.price.toFixed(2) });
      }
    }
    t.sum = +(+total).toFixed(2);
    save();
    render();
    openTrip(t);
    toast("Покупку оновлено за чеком");
  }
}

/* ---------- Клавиатура iOS: шторка над клавиатурой ---------- */
if (window.visualViewport) {
  const fit = () => {
    const vv = window.visualViewport;
    const off = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty("--kb", off + "px");
  };
  window.visualViewport.addEventListener("resize", fit);
  window.visualViewport.addEventListener("scroll", fit);
}

render();
</script>
</body>
