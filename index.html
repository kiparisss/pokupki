<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Покупки">
<meta name="theme-color" content="#f2f2f7">
<title>Список покупок</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2334c759'/%3E%3Ctext x='90' y='118' font-size='90' text-anchor='middle'%3E🛒%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --text2: #8e8e93;
    --accent: #34c759;
    --blue: #007aff;
    --red: #ff3b30;
    --sep: rgba(60,60,67,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #ffffff;
      --text2: #98989f;
      --sep: rgba(84,84,88,0.5);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
    padding: env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  header {
    padding: 18px 16px 6px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  header h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  #counter { font-size: 15px; color: var(--text2); font-weight: 500; }

  /* Вкладки */
  #tabs { display: flex; gap: 6px; padding: 6px 16px 4px; }
  .tab {
    flex: 1;
    border: none; border-radius: 12px;
    padding: 9px 0;
    font-size: 15px; font-weight: 600;
    background: var(--card); color: var(--text2);
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .tab.sel { background: var(--accent); color: #fff; }

  /* Частые покупки и сохранённые списки */
  #favWrap { padding: 8px 0 0; }
  .sec-label { font-size: 13px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.3px; padding: 8px 16px 6px; font-weight: 600; }
  #favs, #savedRow {
    display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 8px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  #favs::-webkit-scrollbar, #savedRow::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    background: var(--card);
    border: none;
    border-radius: 18px;
    padding: 9px 14px;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    transition: transform 0.1s;
    display: flex; align-items: center; gap: 8px;
  }
  .chip:active { transform: scale(0.94); }
  .chip.added { color: var(--accent); }
  .chip .chip-x { color: var(--red); font-size: 17px; line-height: 1; opacity: 0.7; }

  /* Список */
  main { padding: 4px 16px; }
  .cat-title {
    font-size: 13px; font-weight: 700; color: var(--text2);
    text-transform: uppercase; letter-spacing: 0.4px;
    padding: 16px 4px 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .card { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px;
    position: relative;
  }
  .item:not(:last-child)::after {
    content: ""; position: absolute; left: 48px; right: 0; bottom: 0;
    height: 1px; background: var(--sep);
  }
  .check {
    width: 26px; height: 26px; flex: 0 0 26px;
    border: 2px solid var(--text2);
    border-radius: 50%;
    background: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #fff;
    transition: all 0.15s;
  }
  .item.done .check { background: var(--accent); border-color: var(--accent); }
  .item-name { flex: 1; font-size: 17px; min-width: 0; overflow-wrap: break-word; }
  .item.done .item-name { color: var(--text2); text-decoration: line-through; }
  .qty {
    font-size: 15px; color: var(--text2); font-weight: 500;
    background: var(--bg); border-radius: 8px; padding: 3px 8px;
    border: none; white-space: nowrap;
  }
  .del {
    background: none; border: none; color: var(--red);
    font-size: 22px; padding: 4px 2px; line-height: 1;
    opacity: 0.75;
  }
  #empty, .empty {
    text-align: center; color: var(--text2); padding: 50px 30px;
    font-size: 17px; line-height: 1.5;
  }
  #empty .emoji, .empty .emoji { font-size: 52px; display: block; margin-bottom: 12px; }

  /* Кнопки действий */
  #actions { display: flex; gap: 8px; padding: 14px 16px 0; }
  .act-btn {
    flex: 1;
    border: none; border-radius: 12px;
    padding: 12px 8px;
    font-size: 15px; font-weight: 600;
    background: var(--card); color: var(--blue);
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .act-btn.primary { background: var(--accent); color: #fff; }
  .act-btn:disabled { opacity: 0.4; }
  #clearDone {
    display: block; margin: 14px auto 0;
    background: none; border: none; color: var(--blue);
    font-size: 16px; font-weight: 500; padding: 8px 16px;
  }

  /* Статистика */
  #statsView { display: none; padding: 4px 16px; }
  .stat-card {
    background: var(--card); border-radius: 14px;
    padding: 16px; margin-top: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .stat-month { font-size: 17px; font-weight: 700; margin-bottom: 10px; text-transform: capitalize; }
  .stat-nums { display: flex; gap: 8px; }
  .stat-num { flex: 1; text-align: center; }
  .stat-num b { display: block; font-size: 21px; font-weight: 800; }
  .stat-num span { font-size: 12px; color: var(--text2); }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; margin-top: 14px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; }
  .bar { width: 100%; max-width: 44px; background: var(--accent); border-radius: 6px 6px 2px 2px; min-height: 3px; }
  .bar-col.cur .bar { background: var(--blue); }
  .bar-lbl { font-size: 11px; color: var(--text2); }
  .bar-val { font-size: 11px; color: var(--text2); font-weight: 600; }
  .trip {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; position: relative;
  }
  .trip:not(:last-child)::after {
    content: ""; position: absolute; left: 14px; right: 0; bottom: 0;
    height: 1px; background: var(--sep);
  }
  .trip-date { font-size: 15px; }
  .trip-info { font-size: 13px; color: var(--text2); }
  .trip-sum { margin-left: auto; font-size: 16px; font-weight: 700; white-space: nowrap; }

  /* Панель добавления */
  #addBar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--card);
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
    box-shadow: 0 -1px 0 var(--sep), 0 -6px 20px rgba(0,0,0,0.06);
    display: flex; flex-direction: column; gap: 8px;
  }
  #addRow { display: flex; gap: 8px; }
  #nameInput {
    flex: 1; min-width: 0;
    font-size: 17px;
    padding: 11px 14px;
    border: none; border-radius: 12px;
    background: var(--bg); color: var(--text);
    outline: none;
  }
  #qtyInput {
    width: 84px;
    font-size: 16px;
    padding: 11px 10px;
    border: none; border-radius: 12px;
    background: var(--bg); color: var(--text);
    outline: none;
  }
  #nameInput::placeholder, #qtyInput::placeholder { color: var(--text2); }
  #addBtn {
    flex: 0 0 46px; height: 46px;
    border: none; border-radius: 50%;
    background: var(--accent); color: #fff;
    font-size: 26px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s;
  }
  #addBtn:active { transform: scale(0.9); }
  #cats {
    display: flex; gap: 6px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  #cats::-webkit-scrollbar { display: none; }
  .cat-btn {
    flex: 0 0 auto;
    border: none; border-radius: 14px;
    background: var(--bg); color: var(--text2);
    font-size: 13px; font-weight: 600;
    padding: 7px 11px;
  }
  .cat-btn.sel { background: var(--accent); color: #fff; }

  /* Модалка */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center; justify-content: center;
    z-index: 50; padding: 20px;
  }
  #overlay.show { display: flex; }
  #modal {
    background: var(--card);
    border-radius: 16px;
    width: 100%; max-width: 320px;
    padding: 20px 18px 14px;
  }
  #modalTitle { font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 4px; }
  #modalSub { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 12px; }
  #modalInput {
    width: 100%;
    font-size: 17px;
    padding: 11px 14px;
    border: none; border-radius: 12px;
    background: var(--bg); color: var(--text);
    outline: none;
    margin-bottom: 12px;
  }
  #modalBtns { display: flex; gap: 8px; }
  #modalBtns button {
    flex: 1; border: none; border-radius: 12px;
    padding: 12px 0; font-size: 16px; font-weight: 600;
  }
  #modalCancel { background: var(--bg); color: var(--text); }
  #modalOk { background: var(--accent); color: #fff; }
</style>
</head>
<body>

<header>
  <h1>Покупки</h1>
  <span id="counter"></span>
</header>

<div id="tabs">
  <button class="tab sel" id="tabList">🛒 Список</button>
  <button class="tab" id="tabStats">📊 Статистика</button>
</div>

<div id="listView">
  <div id="actions">
    <button class="act-btn" id="saveListBtn">💾 Сохранить список</button>
    <button class="act-btn primary" id="finishBtn">✓ Завершить покупки</button>
  </div>

  <div id="savedWrap" style="display:none">
    <div class="sec-label">Мои списки</div>
    <div id="savedRow"></div>
  </div>

  <div id="favWrap">
    <div class="sec-label">Частые покупки</div>
    <div id="favs"></div>
  </div>

  <main id="list"></main>
</div>

<div id="statsView"></div>

<div id="addBar">
  <div id="addRow">
    <input id="nameInput" type="text" placeholder="Что купить?" autocomplete="off" enterkeyhint="done">
    <input id="qtyInput" type="text" placeholder="Кол-во" autocomplete="off">
    <button id="addBtn" aria-label="Добавить">+</button>
  </div>
  <div id="cats"></div>
</div>

<div id="overlay">
  <div id="modal">
    <div id="modalTitle"></div>
    <div id="modalSub"></div>
    <input id="modalInput" autocomplete="off">
    <div id="modalBtns">
      <button id="modalCancel">Отмена</button>
      <button id="modalOk">Готово</button>
    </div>
  </div>
</div>

<script>
const CATS = [
  { id: "other",  name: "Разное",   icon: "🛍️" },
  { id: "fruit",  name: "Овощи и фрукты", icon: "🥦" },
  { id: "dairy",  name: "Молочное", icon: "🥛" },
  { id: "meat",   name: "Мясо и рыба", icon: "🍗" },
  { id: "bakery", name: "Хлеб",     icon: "🍞" },
  { id: "grocery",name: "Бакалея",  icon: "🍝" },
  { id: "frozen", name: "Заморозка",icon: "🧊" },
  { id: "drinks", name: "Напитки",  icon: "🧃" },
  { id: "home",   name: "Дом и быт",icon: "🧻" }
];

const AUTO = {
  fruit:  ["яблок","банан","огурц","огурец","помидор","томат","картош","картоф","лук","морков","капуст","перец","зелень","укроп","петрушк","лимон","апельсин","мандарин","груш","виноград","ягод","клубник","авокадо","чеснок","свекл","кабач","баклажан","салат","грибы","шампиньон"],
  dairy:  ["молок","кефир","творог","сметан","йогурт","сыр","маслян","сливк","ряженк","сливочн"],
  meat:   ["куриц","курин","мясо","говядин","свинин","фарш","рыб","лосос","сельд","колбас","сосиск","ветчин","бекон","индейк","котлет","креветк"],
  bakery: ["хлеб","батон","булк","лаваш","багет","выпечк","круассан","пирож"],
  grocery:["макарон","рис","гречк","мука","сахар","соль","масло растит","подсолнечн","оливков","крупа","овсянк","чай","кофе","яйц","яиц","консерв","томатн паст","специи","печень","шоколад","конфет"],
  frozen: ["пельмен","мороженое","заморож","вареник"],
  drinks: ["вода","сок","газиров","лимонад","квас","пиво","вино","минералк","кола"],
  home:   ["бумаг","салфетк","мыло","шампун","зубн","порошок","гель","губк","пакет","фольг","средство","чистящ","туалетн"]
};

const MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MONTHS_S = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

const KEY = "shoplist_v1";
let state = load();

function load() {
  let s = { items: [], history: {}, savedLists: {}, trips: [] };
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) s = Object.assign(s, JSON.parse(raw));
  } catch (e) {}
  s.savedLists = s.savedLists || {};
  s.trips = s.trips || [];
  return s;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

function guessCat(name) {
  const n = name.toLowerCase();
  for (const cat in AUTO) {
    if (AUTO[cat].some(w => n.includes(w))) return cat;
  }
  return "other";
}

let selCat = null;
const $ = id => document.getElementById(id);

function addItem(name, qty, cat) {
  name = name.trim();
  if (!name) return;
  const key = name.toLowerCase();
  const existing = state.items.find(i => i.name.toLowerCase() === key && !i.done);
  if (existing) {
    if (qty) existing.qty = qty;
  } else {
    state.items.push({
      id: Date.now() + Math.random(),
      name,
      qty: qty || "",
      cat: cat || guessCat(name),
      done: false
    });
  }
  const h = state.history[key] || { name, count: 0, cat: cat || guessCat(name), qty: "" };
  h.count++;
  if (qty) h.qty = qty;
  state.history[key] = h;
  save();
  render();
}

function toggle(id) {
  const it = state.items.find(i => i.id === id);
  if (it) { it.done = !it.done; save(); render(); }
}
function remove(id) {
  state.items = state.items.filter(i => i.id !== id);
  save(); render();
}
function clearDone() {
  state.items = state.items.filter(i => !i.done);
  save(); render();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function fmtSum(n) {
  return n.toLocaleString("ru-RU", { maximumFractionDigits: 2 });
}

/* ---------- Модалка ---------- */
let modalCb = null;
function askModal(title, sub, placeholder, inputMode, cb) {
  $("modalTitle").textContent = title;
  $("modalSub").textContent = sub;
  const inp = $("modalInput");
  inp.value = "";
  inp.placeholder = placeholder;
  inp.inputMode = inputMode || "text";
  modalCb = cb;
  $("overlay").classList.add("show");
  setTimeout(() => inp.focus(), 50);
}
$("modalCancel").addEventListener("click", () => { $("overlay").classList.remove("show"); modalCb = null; });
$("modalOk").addEventListener("click", () => {
  const v = $("modalInput").value.trim();
  $("overlay").classList.remove("show");
  if (modalCb) modalCb(v);
  modalCb = null;
});
$("modalInput").addEventListener("keydown", e => { if (e.key === "Enter") $("modalOk").click(); });

/* ---------- Сохранённые списки ---------- */
$("saveListBtn").addEventListener("click", () => {
  if (!state.items.length) { askModal("Список пуст", "Сначала добавьте покупки", "", "text", () => {}); return; }
  askModal("Сохранить список", "Например: «На неделю», «Шашлыки»", "Название списка", "text", name => {
    if (!name) return;
    state.savedLists[name] = state.items.map(i => ({ name: i.name, qty: i.qty, cat: i.cat }));
    save(); render();
  });
});

function loadSaved(name) {
  const list = state.savedLists[name];
  if (!list) return;
  for (const it of list) addItem(it.name, it.qty, it.cat);
}

$("savedRow").addEventListener("click", e => {
  const x = e.target.closest(".chip-x");
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const name = chip.dataset.name;
  if (x) {
    askModal("Удалить список?", "«" + name + "» — напишите «да» для удаления", "да", "text", v => {
      if (v.toLowerCase() === "да") { delete state.savedLists[name]; save(); render(); }
    });
  } else {
    loadSaved(name);
    chip.classList.add("added");
  }
});

/* ---------- Завершение покупок ---------- */
$("finishBtn").addEventListener("click", () => {
  const bought = state.items.filter(i => i.done);
  if (!bought.length) {
    askModal("Нечего завершать", "Сначала отметьте купленные товары галочками", "", "text", () => {});
    return;
  }
  askModal("Сколько потратили?", "Сумма за " + bought.length + " тов. — попадёт в статистику", "Сумма, напр. 2450", "decimal", v => {
    const sum = parseFloat(v.replace(",", ".").replace(/\s/g, ""));
    if (isNaN(sum) || sum < 0) return;
    state.trips.push({
      date: new Date().toISOString(),
      sum,
      items: bought.map(i => i.name)
    });
    state.items = state.items.filter(i => !i.done);
    save(); render();
    showTab("stats");
  });
});

/* ---------- Статистика ---------- */
function renderStats() {
  const el = $("statsView");
  const trips = state.trips.slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  if (!trips.length) {
    el.innerHTML = `<div class="empty"><span class="emoji">📊</span>Пока нет данных.<br>Отметьте покупки, нажмите<br>«Завершить покупки» и введите сумму.</div>`;
    return;
  }
  const now = new Date();
  const byMonth = {};
  for (const t of trips) {
    const d = new Date(t.date);
    const k = d.getFullYear() + "-" + d.getMonth();
    byMonth[k] = byMonth[k] || { sum: 0, count: 0 };
    byMonth[k].sum += t.sum;
    byMonth[k].count++;
  }
  const curKey = now.getFullYear() + "-" + now.getMonth();
  const cur = byMonth[curKey] || { sum: 0, count: 0 };

  let html = `<div class="stat-card">
    <div class="stat-month">${MONTHS[now.getMonth()]} ${now.getFullYear()}</div>
    <div class="stat-nums">
      <div class="stat-num"><b>${fmtSum(cur.sum)} ₽</b><span>потрачено</span></div>
      <div class="stat-num"><b>${cur.count}</b><span>походов</span></div>
      <div class="stat-num"><b>${cur.count ? fmtSum(cur.sum / cur.count) : 0} ₽</b><span>средний чек</span></div>
    </div>
  </div>`;

  const cols = [];
  let max = 0;
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const k = d.getFullYear() + "-" + d.getMonth();
    const m = byMonth[k] || { sum: 0 };
    max = Math.max(max, m.sum);
    cols.push({ lbl: MONTHS_S[d.getMonth()], sum: m.sum, cur: i === 0 });
  }
  if (max > 0) {
    html += `<div class="stat-card"><div class="stat-month" style="font-size:15px">Последние 6 месяцев</div><div class="bars">`;
    for (const c of cols) {
      const h = max ? Math.round(c.sum / max * 90) : 0;
      html += `<div class="bar-col${c.cur ? " cur" : ""}">
        <div class="bar-val">${c.sum ? fmtSum(c.sum) : ""}</div>
        <div class="bar" style="height:${h}%"></div>
        <div class="bar-lbl">${c.lbl}</div>
      </div>`;
    }
    html += `</div></div>`;
  }

  html += `<div class="sec-label" style="padding-left:4px;margin-top:14px">История покупок</div><div class="card">`;
  for (const t of trips.slice(0, 30)) {
    const d = new Date(t.date);
    const ds = d.getDate() + " " + MONTHS_S[d.getMonth()] + " " + d.getFullYear();
    html += `<div class="trip" data-date="${t.date}">
      <div>
        <div class="trip-date">${ds}</div>
        <div class="trip-info">${t.items.length} тов.: ${esc(t.items.slice(0, 3).join(", "))}${t.items.length > 3 ? "…" : ""}</div>
      </div>
      <span class="trip-sum">${fmtSum(t.sum)} ₽</span>
      <button class="del" aria-label="Удалить">×</button>
    </div>`;
  }
  html += `</div>`;
  el.innerHTML = html;
}

$("statsView").addEventListener("click", e => {
  if (!e.target.closest(".del")) return;
  const row = e.target.closest(".trip");
  if (!row) return;
  askModal("Удалить запись?", "Напишите «да» для удаления", "да", "text", v => {
    if (v.toLowerCase() === "да") {
      state.trips = state.trips.filter(t => t.date !== row.dataset.date);
      save(); renderStats();
    }
  });
});

/* ---------- Вкладки ---------- */
function showTab(which) {
  const isList = which === "list";
  $("listView").style.display = isList ? "" : "none";
  $("addBar").style.display = isList ? "" : "none";
  $("statsView").style.display = isList ? "none" : "block";
  $("tabList").classList.toggle("sel", isList);
  $("tabStats").classList.toggle("sel", !isList);
  if (!isList) renderStats();
}
$("tabList").addEventListener("click", () => showTab("list"));
$("tabStats").addEventListener("click", () => showTab("stats"));

/* ---------- Рендер списка ---------- */
function render() {
  const total = state.items.length;
  const left = state.items.filter(i => !i.done).length;
  $("counter").textContent = total ? (left ? "осталось: " + left : "всё куплено ✓") : "";

  $("finishBtn").disabled = !state.items.some(i => i.done);

  const names = Object.keys(state.savedLists);
  $("savedWrap").style.display = names.length ? "" : "none";
  $("savedRow").innerHTML = names.map(n =>
    `<button class="chip" data-name="${esc(n)}">📋 ${esc(n)} <span class="chip-x">×</span></button>`
  ).join("");

  const activeNames = new Set(state.items.filter(i => !i.done).map(i => i.name.toLowerCase()));
  const favs = Object.values(state.history)
    .filter(h => h.count >= 2 && !activeNames.has(h.name.toLowerCase()))
    .sort((a, b) => b.count - a.count)
    .slice(0, 10);
  $("favWrap").style.display = favs.length ? "" : "none";
  $("favs").innerHTML = favs.map(h =>
    `<button class="chip" data-name="${esc(h.name)}" data-qty="${esc(h.qty)}" data-cat="${h.cat}">+ ${esc(h.name)}</button>`
  ).join("");

  const listEl = $("list");
  if (!total) {
    listEl.innerHTML = `<div id="empty"><span class="emoji">🛒</span>Список пуст.<br>Добавьте первую покупку ниже.</div>`;
    return;
  }
  let html = "";
  for (const cat of CATS) {
    const items = state.items.filter(i => i.cat === cat.id);
    if (!items.length) continue;
    items.sort((a, b) => a.done - b.done);
    html += `<div class="cat-title">${cat.icon} ${cat.name}</div><div class="card">`;
    for (const i of items) {
      html += `<div class="item${i.done ? " done" : ""}" data-id="${i.id}">
        <button class="check" aria-label="Отметить">${i.done ? "✓" : ""}</button>
        <span class="item-name">${esc(i.name)}</span>
        ${i.qty ? `<span class="qty">${esc(i.qty)}</span>` : ""}
        <button class="del" aria-label="Удалить">×</button>
      </div>`;
    }
    html += `</div>`;
  }
  const doneCount = state.items.filter(i => i.done).length;
  if (doneCount) html += `<button id="clearDone">Убрать купленное без учёта (${doneCount})</button>`;
  listEl.innerHTML = html;
}

function renderCats() {
  $("cats").innerHTML =
    `<button class="cat-btn${selCat === null ? " sel" : ""}" data-cat="">✨ Авто</button>` +
    CATS.map(c =>
      `<button class="cat-btn${selCat === c.id ? " sel" : ""}" data-cat="${c.id}">${c.icon} ${c.name}</button>`
    ).join("");
}

$("addBtn").addEventListener("click", doAdd);
$("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });
$("qtyInput").addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });

function doAdd() {
  const name = $("nameInput").value;
  const qty = $("qtyInput").value.trim();
  if (!name.trim()) { $("nameInput").focus(); return; }
  addItem(name, qty, selCat);
  $("nameInput").value = "";
  $("qtyInput").value = "";
  $("nameInput").focus();
}

$("cats").addEventListener("click", e => {
  const b = e.target.closest(".cat-btn");
  if (!b) return;
  selCat = b.dataset.cat || null;
  renderCats();
});

$("favs").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  addItem(b.dataset.name, b.dataset.qty, b.dataset.cat);
  b.classList.add("added");
});

$("list").addEventListener("click", e => {
  if (e.target.closest("#clearDone")) { clearDone(); return; }
  const row = e.target.closest(".item");
  if (!row) return;
  const id = parseFloat(row.dataset.id);
  if (e.target.closest(".del")) remove(id);
  else toggle(id);
});

renderCats();
render();
</script>
</body>
</html>
